name: Keep backend awake

# Render's free plan spins the backend down after ~15 minutes idle, and the
# next request pays a 30-50s cold-start cost with no on-screen indication
# anything is happening -- bad news for a submission that could be opened
# any time in an evaluation window, not just a scheduled demo. Pinging
# /health well inside that 15-minute window keeps it from ever sleeping.
#
# GitHub itself doesn't guarantee scheduled workflows fire exactly on time
# (they can slip a few minutes under load) -- 10 minutes leaves enough
# buffer under the 15-minute threshold to absorb that.
on:
  schedule:
    - cron: "*/10 * * * *"
  # Lets this be triggered by hand from the Actions tab, e.g. to confirm the
  # backend is reachable without waiting for the next scheduled tick.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          curl -sf --max-time 60 https://sentinels-backend-swlu.onrender.com/health
