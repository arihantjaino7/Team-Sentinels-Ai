services:
  - type: web
    name: sentinels-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    # Render's free plan does not support persistent disks (paid plans only).
    # db.py's DB_PATH (backend/data/sentinels.db) therefore lives on the
    # container's ephemeral filesystem — it survives restarts within the
    # same running instance, but resets on every redeploy. Fine for a
    # hackathon demo; upgrade to a paid plan and add a `disk:` block
    # mounted at /app/backend/data if scans need to persist across deploys.
    envVars:
      - key: SENTINELS_ENV
        value: production
      - key: SENTINELS_SESSION_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY_PATH
        sync: false
      - key: SENTINELS_FRONTEND_ORIGIN
        sync: false
